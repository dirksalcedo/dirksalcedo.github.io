<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Dirk Salcedo</title>
  <meta name="description" content="Get in touch with Dirk Salcedo.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <main>
    <p><a href="/">← Dirk Salcedo</a></p>
    <h1>Contact</h1>
    <p>Story tips, questions or just to talk airlines. I'll get back to you by email.</p>

    <form id="contact" action="https://dirksalcedo-contact.WORKERS_SUBDOMAIN.workers.dev" method="post">
      <label>Name <input name="name" autocomplete="name" maxlength="100" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" maxlength="200" required></label>
      <label>Message <textarea name="message" rows="6" maxlength="5000" required></textarea></label>
      <div class="cf-turnstile" data-sitekey="TURNSTILE_SITE_KEY" data-theme="auto"></div>
      <button type="submit">Send</button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("contact");
    const status = document.getElementById("status");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      status.textContent = "Sending…";
      try {
        const res = await fetch(form.action, { method: "POST", body: new FormData(form) });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        form.reset();
        status.textContent = "Thanks! Your message is on its way.";
      } catch (err) {
        status.textContent = err.message || "Something went wrong. Please try again.";
      } finally {
        if (window.turnstile) turnstile.reset();
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
